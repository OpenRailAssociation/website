id: opensource
title: "Open Source for Digital Sovereignty in Rail"
content: |
  <p>
      Railway is critical infrastructure. The software that runs it
      increasingly determines whether organizations can make independent
      decisions about their own systems, or whether those decisions are
      constrained by the tools and platforms available to them.
  </p>

  <p>
      Open source provides the transparency, interoperability, and shared
      investment that turn digital sovereignty from a policy goal into
      operational reality. No lock-in. No opaque supply chains. No single
      provider controlling the stack.
  </p>

  <blockquote>
      <b>Choice. Control. Influence.</b>
  </blockquote>

  <p>
      OpenRail gives its members open source alternatives across the rail
      software stack, governance rights over the projects they depend on,
      and the freedom to operate, adapt, and switch without permission.
  </p>
