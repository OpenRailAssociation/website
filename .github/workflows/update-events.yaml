name: Update public events data

on:
  schedule:
    - cron: "0 * * * *" # Every hour
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-events:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true # Needed to push the commit below
          token: ${{ secrets.WEBSITE_UPDATE_TOKEN }} # token by openrail-tech user

      - name: Setup required build tools with mise
        uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4

      - name: Fetch and convert ICS calendar to JSON
        run: mise run events-fetch

      - name: Commit and push if changed
        uses: stefanzweifel/git-auto-commit-action@d0b01107b5db882071f96de5dd4b54961ea93f4c # v7.2.1
        with:
          commit_message: "chore(events): update public events data"
          commit_user_name: "OpenRail Tech"
          commit_user_email: "techadmin@openrailassociation.org"
          commit_author: "OpenRail Tech <techadmin@openrailassociation.org>"
          file_pattern: data/events_public.json
