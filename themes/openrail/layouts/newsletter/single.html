{{- define "main" }}
  <section class="newsletter-single">
    <header>
      <h2>{{ .Title }}</h2>
      <p class="newsletter-date"><span class="icon regular fa-calendar"></span> {{ .Date.Format "02 January 2006" }}</p>
    </header>
    {{ with .Params.image }}
    <div class="newsletter-hero">
      {{ $alt := .alt | default "Newsletter header image" }}
      {{- with (resources.Get .src).Resize "1600x" }}
      <img src="{{ .RelPermalink }}" alt="{{ $alt }}" />
      {{- end }}
    </div>
    {{ end }}
    <div class="newsletter-body">
      {{ .Content }}
    </div>
    <p class="newsletter-back"><a href="{{ .Parent.RelPermalink }}">« All newsletter issues</a></p>
  </section>
{{- end }}
